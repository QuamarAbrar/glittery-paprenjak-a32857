<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2f6ce5" />
    <meta name="description" content="Log in to Northstar Academy and continue your learning path." />
    <title>Log in — Northstar Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/auth.css" />
    <script type="module" src="/assets/auth.js"></script>
  </head>
  <body data-mode="login">
    <main class="page-shell">
      <section class="auth-card" aria-labelledby="page-title">
        <aside class="story-panel" aria-label="Desert dunes at dusk in a real photograph from Unsplash">
          <div class="story-shade"></div>
          <a class="brand" href="/" aria-label="Northstar Academy home"><span class="brand-icon" aria-hidden="true">N</span><span>Northstar <strong>Academy</strong></span></a>
          <a class="back-link" href="/" aria-label="Back to website"><span>Back to website</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
          <div class="story-copy">
            <p class="eyebrow">Your next lesson is waiting</p>
            <h2>Pick up where<br />you left off.</h2>
            <div class="slider-dots" aria-hidden="true"><span></span><span class="active"></span><span></span></div>
          </div>
          <a class="photo-credit" href="https://unsplash.com" target="_blank" rel="noreferrer">Photo via Unsplash</a>
        </aside>

        <div class="form-panel">
          <div class="mobile-brand" aria-hidden="true"><span class="brand-icon">N</span><span>Northstar <strong>Academy</strong></span></div>
          <div class="form-wrap">
            <header class="form-header">
              <p class="section-label">Welcome back</p>
              <h1 id="page-title">Log in to Northstar</h1>
              <p>New here? <a href="/signup.html">Create an account</a></p>
            </header>

            <div id="auth-message" class="auth-message" role="status" aria-live="polite" hidden></div>

            <form id="auth-form" novalidate>
              <label class="field">
                <span>Email address</span>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
                <small class="field-error"></small>
              </label>

              <label class="field">
                <span>Password</span>
                <span class="password-input">
                  <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required />
                  <button class="reveal-password" type="button" aria-label="Show password" aria-pressed="false">
                    <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
                    <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 16 16M10.6 6.2A9.7 9.7 0 0 1 12 6c6 0 9.5 6 9.5 6a15 15 0 0 1-2.2 2.8M6.1 6.1C3.7 7.8 2.5 12 2.5 12s3.5 6 9.5 6a9.5 9.5 0 0 0 3-.5M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                  </button>
                </span>
                <small class="field-error"></small>
              </label>

              <div class="login-options">
                <label class="check-row compact"><input name="remember" type="checkbox" /><span class="custom-check"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="m2.5 7 3 3 6-6"/></svg></span><span>Remember me</span></label>
                <button id="forgot-password" class="text-button" type="button">Forgot password?</button>
              </div>

              <button class="primary-button" type="submit"><span>Log in</span><span class="button-loader" aria-hidden="true"></span></button>
            </form>

            <div class="divider"><span>Or continue with</span></div>
            <div class="social-grid">
              <button class="social-button" type="button" data-provider="google" aria-label="Continue with Google"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4a4.6 4.6 0 0 1-2 3v2.6h3.3c1.9-1.8 2.9-4.4 2.9-7.5Z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.7-2.3l-3.3-2.6c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.2H3v2.7A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.4 13.9A6 6 0 0 1 6.1 12c0-.7.1-1.3.3-1.9V7.4H3A10 10 0 0 0 2 12c0 1.7.4 3.2 1 4.6l3.4-2.7Z"/><path fill="#EA4335" d="M12 5.9c1.5 0 2.8.5 3.9 1.5l2.9-2.9A9.8 9.8 0 0 0 12 2a10 10 0 0 0-9 5.4l3.4 2.7C7.2 7.7 9.4 5.9 12 5.9Z"/></svg><span>Google</span></button>
              <button class="social-button" type="button" data-provider="github" aria-label="Continue with GitHub"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.9c-2.8.6-3.4-1.2-3.4-1.2-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.6.3-1.1.6-1.3-2.2-.3-4.6-1.1-4.6-5a3.9 3.9 0 0 1 1-2.7 3.6 3.6 0 0 1 .1-2.7s.9-.3 2.8 1a9.7 9.7 0 0 1 5.1 0c2-1.3 2.8-1 2.8-1a3.6 3.6 0 0 1 .1 2.7 3.9 3.9 0 0 1 1 2.7c0 3.9-2.4 4.7-4.6 5 .4.3.7 1 .7 2V21c0 .3.2.6.7.5A10 10 0 0 0 12 2Z"/></svg><span>GitHub</span></button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
